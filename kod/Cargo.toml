[package]
name = "qrgen_rust"
version = "0.1.0"
edition = "2021"

[dependencies]
# Kodowanie QR - wylaczamy domyslne funkcje (image/svg/pic), bo renderujemy
# piksele recznie w qr_logic.rs (pelna kontrola nad skala/ramka/kolorami).
qrcode = { version = "0.14", default-features = false }

# Zapis do JPG/PNG/BMP oraz odczyt obrazow z kodami QR. Wylaczamy niepotrzebne
# formaty (avif, tiff, webp, ...), zeby ograniczyc czas kompilacji i zaleznosci.
image = { version = "0.25", default-features = false, features = ["png", "bmp", "jpeg"] }

# Dekodowanie kodow QR z obrazow (czysty Rust, bez zaleznosci C).
# Bez domyslnych funkcji - uzywamy prepare_from_greyscale, wiec nie potrzebujemy
# integracji z konkretna wersja crate'a image.
rqrr = { version = "0.10", default-features = false }

# JSON: wejscie --input z systemow zewnetrznych (ERP) oraz plik ustawien.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Zapis dokumentu .docx (paczka zip z plikami XML).
zip = { version = "8", default-features = false, features = ["deflate"] }

# GUI (immediate-mode, natywne okno na Windows/macOS/Linux).
eframe = { version = "0.35", default-features = false, features = [
    "default_fonts",
    "glow",
    "x11",
    "wayland",
] }

# Natywne okno dialogowe "Zapisz jako".
rfd = "0.17"

# Schowek systemowy - kopiowanie tekstu (przez egui) oraz obrazu QR (bezposrednio).
# Ta sama wersja jest juz uzywana przez eframe/egui-winit, wiec nie dociaga nic nowego.
arboard = "3.6"

# Windows-owe API: doczepienie konsoli w trybie --silent/--help (main.rs) oraz
# odczyt motywu jasny/ciemny z rejestru (gui.rs) bez odpalania procesow zewnetrznych.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_System_Console", "Win32_Foundation", "Win32_System_Registry"] }

[profile.release]
opt-level = 3
lto = true
strip = true
